name: Overwatch acceptance gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overwatch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend-lint-and-locked-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Configure required reviewers and the authorized short-lived index token
    # in this environment before using this as an acceptance gate.
    environment: overwatch-ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.12'
      - name: Install pinned uv
        run: python -m pip install uv==0.10.0
      - name: Require supported runtime and authorized CI credential route
        env:
          OVERWATCH_CI_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          UV_INDEX_TSCORE_PASSWORD: ${{ secrets.TSCORE_CODEARTIFACT_TOKEN }}
        run: python scripts/ci_prerequisites.py --ci
      - name: Install the unchanged dependency lock
        env:
          UV_INDEX_TSCORE_USERNAME: aws
          UV_INDEX_TSCORE_PASSWORD: ${{ secrets.TSCORE_CODEARTIFACT_TOKEN }}
          UV_HTTP_TIMEOUT: '30'
          UV_HTTP_RETRIES: '2'
        run: uv sync --locked --group dev --python 3.13.12
      - name: Backend lint
        run: uv run --locked --no-sync ruff check src tests scripts
      - name: Backend suite with explicit skip reasons
        run: uv run --locked --no-sync pytest -q -ra --junitxml=backend-junit.xml
      - name: Preserve lock and dependency constraints
        run: git diff --exit-code -- pyproject.toml uv.lock

  frontend:
    name: frontend-typecheck-vitest-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Install frontend lock without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Vitest
        run: npm test
      - name: Production build
        run: npm run build
      - name: Preserve frontend dependencies
        run: git diff --exit-code -- package.json package-lock.json
